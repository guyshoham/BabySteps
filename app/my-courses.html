<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הקורסים שלי — מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <meta name="theme-color" content="#704229" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="מתחילים בקטן" />
</head>
<body class="min-h-screen p-4">
  <div class="max-w-3xl mx-auto py-4">
    <h1 class="text-2xl font-bold">הקורסים שלי</h1>
  </div>
  <div id="loading" role="status" aria-live="polite"
       class="max-w-3xl mx-auto flex items-center justify-center gap-3 py-12 text-[#704229]">
    <span class="w-6 h-6 border-4 border-[#704229]/20 border-t-[#704229] rounded-full animate-spin" aria-hidden="true"></span>
    <span>טוען...</span>
  </div>
  <main id="list" class="max-w-3xl mx-auto grid gap-4 sm:grid-cols-2"></main>
  <div id="empty" class="max-w-3xl mx-auto text-center app-mid app-card p-6 hidden">
    <p class="font-medium">עדיין אין לך קורסים כאן.</p>
    <p class="text-sm mt-2">רכשת קורס והוא לא מופיע? כתבי לנו ונסדר את זה.</p>
    <a href="https://wa.me/972542366243" target="_blank" rel="noopener"
       class="mt-4 app-btn px-5 py-3">כתבי לנו בוואטסאפ</a>
  </div>
  <div id="error" class="max-w-3xl mx-auto text-center text-red-600 hidden">
    <p>לא הצלחנו לטעון את הקורסים. נסי לרענן את הדף.</p>
    <p class="text-sm mt-2 app-mid">זה חוזר?
      <a href="https://wa.me/972542366243" target="_blank" rel="noopener" class="app-link">כתבי לנו בוואטסאפ</a>
    </p>
  </div>

  <script type="module">
    import { requireAuth, db, signOut, collection, getDocs, doc, getDoc } from "/app/firebase-client.js";
    import { visibleCourses } from "/app/course-list.js";
    import { mountAppHeader } from "/app/app-shell.js";

    const shell = mountAppHeader();
    const user = await requireAuth();
    shell.showUser(user.email, async () => {
      await signOut(); location.replace("/app/login");
    });

    const loading = document.getElementById("loading");
    let redirecting = false;
    try {
      redirecting = await render();
    } catch (err) {
      console.error(err);
      document.getElementById("error").classList.remove("hidden");
    } finally {
      // Keep the spinner while we move to the only course.
      if (!redirecting) loading.classList.add("hidden");
    }

    async function render() {
      const enrollSnap = await getDocs(collection(db, "users", user.uid, "enrollments"));
      const list = document.getElementById("list");

      // Fetch all enrolled courses at once, then hide unpublished ones and sort by `order`.
      const courseSnaps = await Promise.all(
        enrollSnap.docs.map((enr) => getDoc(doc(db, "courses", enr.id)))
      );
      const courses = visibleCourses(
        courseSnaps.filter((s) => s.exists()).map((s) => s.data())
      );

      // One course only: skip the list and open it. replace() keeps "back" from
      // bouncing here again. ?all=1 (the course page's back link) keeps the list.
      const showAll = new URLSearchParams(location.search).has("all");
      if (courses.length === 1 && courses[0].slug && !showAll) {
        location.replace(`/app/course/${encodeURIComponent(courses[0].slug)}`);
        return true;
      }

      if (!courses.length) { document.getElementById("empty").classList.remove("hidden"); }

      for (const c of courses) {
        const a = document.createElement("a");
        a.href = `/app/course/${encodeURIComponent(c.slug)}`;
        a.className = "block app-card overflow-hidden";
        // Build with DOM APIs (textContent/setAttribute) — never innerHTML with Firestore data.
        if (c.coverImage) {
          const img = document.createElement("img");
          img.setAttribute("src", c.coverImage);
          img.setAttribute("alt", "");
          img.className = "w-full h-40 object-cover";
          a.appendChild(img);
        }
        const body = document.createElement("div");
        body.className = "p-4";
        const h2 = document.createElement("h2");
        h2.className = "font-bold text-lg";
        h2.textContent = c.title ?? "";
        const p = document.createElement("p");
        p.className = "text-sm app-mid mt-1";
        p.textContent = c.description ?? "";
        body.append(h2, p);
        a.appendChild(body);
        list.appendChild(a);
      }
      return false;
    }
  </script>
</body>
</html>
