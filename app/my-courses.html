<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>הקורסים שלי | מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <meta name="theme-color" content="#704229" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="מתחילים בקטן" />
</head>
<body class="app-page">
  <div class="app-wrap app-courses-head">
    <h1 class="app-h1">הקורסים שלי</h1>
    <!-- Only for admins (custom claim admin: true). The API checks it again. -->
    <a id="admin-link" href="/app/admin" class="app-link app-admin-link" hidden>ניהול</a>
  </div>

  <!-- Skeleton rows in the shape of the course rows below. -->
  <div id="loading" role="status" aria-live="polite" class="app-wrap app-course-list">
    <span class="app-sr-only">טוען...</span>
    <div class="app-card app-course" aria-hidden="true">
      <span class="app-skeleton app-course-cover"></span>
      <span class="app-course-body">
        <span class="app-skeleton app-skeleton--text" style="inline-size: 55%; block-size: 20px"></span>
        <span class="app-skeleton app-skeleton--text" style="inline-size: 90%; margin-block-start: 8px"></span>
        <span class="app-skeleton app-skeleton--text" style="inline-size: 70%"></span>
      </span>
      <span></span>
    </div>
    <div class="app-card app-course" aria-hidden="true">
      <span class="app-skeleton app-course-cover"></span>
      <span class="app-course-body">
        <span class="app-skeleton app-skeleton--text" style="inline-size: 45%; block-size: 20px"></span>
        <span class="app-skeleton app-skeleton--text" style="inline-size: 85%; margin-block-start: 8px"></span>
        <span class="app-skeleton app-skeleton--text" style="inline-size: 60%"></span>
      </span>
      <span></span>
    </div>
  </div>

  <main id="list" class="app-wrap app-course-list"></main>

  <div id="empty" class="app-wrap app-card app-state hidden">
    <p class="app-state-title">עדיין אין לך קורסים כאן.</p>
    <p class="app-mid">רכשת קורס והוא לא מופיע? כתבי לנו ונסדר את זה.</p>
    <a href="https://wa.me/972542366243" target="_blank" rel="noopener" class="app-btn">
      <svg class="app-icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-brand-whatsapp"/></svg>
      כתבי לנו בוואטסאפ
    </a>
  </div>
  <div id="error" role="alert" class="app-wrap app-card app-state hidden">
    <p class="app-state-title app-msg--error">לא הצלחנו לטעון את הקורסים. נסי לרענן את הדף.</p>
    <p class="app-mid">זה חוזר?
      <a href="https://wa.me/972542366243" target="_blank" rel="noopener" class="app-link">כתבי לנו בוואטסאפ</a>
    </p>
  </div>

  <script type="module">
    import { requireAuth, db, signOut, collection, getDocs, doc, getDoc } from "/app/firebase-client.js";
    import { visibleCourses } from "/app/course-list.js";
    import { mountAppHeader } from "/app/app-shell.js";

    const SPRITE = "/assets/icons/sprite.svg";
    const SVG = "http://www.w3.org/2000/svg";

    const shell = mountAppHeader();
    const user = await requireAuth();
    shell.showUser(user.email, async () => {
      await signOut(); location.replace("/app/login");
    });

    // Admins get a "ניהול" link, and stay on this list (no jump to the only course).
    // The claim comes from the cached token, so this needs no network call.
    const isAdmin = user.getIdTokenResult()
      .then((t) => t.claims.admin === true)
      .catch(() => false);
    isAdmin.then((yes) => { document.getElementById("admin-link").hidden = !yes; });

    const loading = document.getElementById("loading");
    let redirecting = false;
    try {
      redirecting = await render();
    } catch (err) {
      console.error(err);
      document.getElementById("error").classList.remove("hidden");
    } finally {
      // Keep the skeleton while we move to the only course.
      if (!redirecting) loading.classList.add("hidden");
    }

    function icon(id, className) {
      const svg = document.createElementNS(SVG, "svg");
      svg.setAttribute("class", className);
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS(SVG, "use");
      use.setAttribute("href", `${SPRITE}#${id}`);
      svg.appendChild(use);
      return svg;
    }

    async function render() {
      const enrollSnap = await getDocs(collection(db, "users", user.uid, "enrollments"));
      const list = document.getElementById("list");

      // Fetch all enrolled courses at once, then hide unpublished ones and sort by `order`.
      const courseSnaps = await Promise.all(
        enrollSnap.docs.map((enr) => getDoc(doc(db, "courses", enr.id)))
      );
      const courses = visibleCourses(
        courseSnaps.filter((s) => s.exists()).map((s) => s.data())
      );

      // One course only: skip the list and open it. replace() keeps "back" from
      // bouncing here again. ?all=1 (the course page's back link) keeps the list.
      const showAll = new URLSearchParams(location.search).has("all");
      if (courses.length === 1 && courses[0].slug && !showAll && !(await isAdmin)) {
        location.replace(`/app/course/${encodeURIComponent(courses[0].slug)}`);
        return true;
      }

      // Swap the skeleton for the real rows in one step, so nothing jumps.
      loading.classList.add("hidden");
      if (!courses.length) { document.getElementById("empty").classList.remove("hidden"); }

      for (const c of courses) {
        // Build with DOM APIs (textContent/setAttribute), never innerHTML with Firestore data.
        const a = document.createElement("a");
        a.href = `/app/course/${encodeURIComponent(c.slug)}`;
        a.className = c.coverImage ? "app-card app-course" : "app-card app-course app-course--nocover";
        if (c.coverImage) {
          const img = document.createElement("img");
          img.setAttribute("src", c.coverImage);
          img.setAttribute("alt", "");
          img.setAttribute("width", "112");
          img.setAttribute("height", "140");
          img.setAttribute("decoding", "async");
          img.className = "app-course-cover";
          a.appendChild(img);
        }
        const body = document.createElement("div");
        body.className = "app-course-body";
        const h2 = document.createElement("h2");
        h2.className = "app-course-title";
        h2.textContent = c.title ?? "";
        body.appendChild(h2);
        if (c.description) {
          const p = document.createElement("p");
          p.className = "app-course-desc";
          p.textContent = c.description;
          body.appendChild(p);
        }
        a.append(body, icon("i-chevron-forward", "app-icon app-course-go icon--dir"));
        list.appendChild(a);
      }
      return false;
    }
  </script>
</body>
</html>
