<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שיעור — מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:'Rubik',sans-serif}</style>
</head>
<body class="min-h-screen bg-[#fdf6f0] p-4">
  <header class="max-w-3xl mx-auto py-4">
    <a id="back" href="/app/my-courses" class="text-sm underline text-[#704229]">→ חזרה לקורס</a>
    <h1 id="title" class="text-2xl font-bold mt-2"></h1>
  </header>
  <main class="max-w-3xl mx-auto">
    <video id="video" class="w-full rounded-2xl shadow bg-black" controls playsinline
           controlsList="nodownload" oncontextmenu="return false"></video>
    <img id="image" class="w-full rounded-2xl shadow hidden" alt="" oncontextmenu="return false" />
    <p id="msg" class="text-center text-red-600 mt-3"></p>
    <nav id="nav" class="hidden flex items-center justify-between gap-3 mt-4">
      <a id="prev" class="invisible px-4 py-3 rounded-xl bg-white shadow text-[#704229] font-medium">→ הקודם</a>
      <a id="next" class="invisible px-4 py-3 rounded-xl bg-white shadow text-[#704229] font-medium">לשיעור הבא ←</a>
    </nav>
  </main>

  <script type="module">
    import { requireAuth, db } from "/app/firebase-client.js";
    import { findNeighbors } from "/app/lesson-nav.js";
    import { collection, query, where, orderBy, getDocs, doc, getDoc, setDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const lessonId = decodeURIComponent(location.pathname.split("/").pop());
    const user = await requireAuth();
    const msg = document.getElementById("msg");
    const video = document.getElementById("video");

    const image = document.getElementById("image");

    const lessonSnap = await getDoc(doc(db, "lessons", lessonId));
    if (!lessonSnap.exists()) { msg.textContent = "השיעור לא נמצא"; throw new Error("no lesson"); }
    const lesson = lessonSnap.data();
    document.getElementById("title").textContent = lesson.title;
    // Lessons are videos unless marked otherwise; older docs have no `kind`.
    const isImage = lesson.kind === "image";

    // Back link and prev/next buttons. Runs alongside the video load, so a slow
    // query never delays playback.
    const next = document.getElementById("next");
    const navReady = (async () => {
      const [courseSnap, lessonsSnap] = await Promise.all([
        getDoc(doc(db, "courses", lesson.courseId)),
        getDocs(query(collection(db, "lessons"), where("courseId", "==", lesson.courseId), orderBy("order"))),
      ]);
      const courseUrl = courseSnap.exists()
        ? `/app/course/${encodeURIComponent(courseSnap.data().slug)}`
        : "/app/my-courses";
      document.getElementById("back").setAttribute("href", courseUrl);
      const n = findNeighbors(lessonsSnap.docs.map(d => d.id), lessonId);
      const show = (el, id) => {
        if (!id) return;
        el.setAttribute("href", `/app/lesson/${encodeURIComponent(id)}`);
        el.classList.remove("invisible");
      };
      show(document.getElementById("prev"), n.prev);
      if (n.next) {
        show(next, n.next);
      } else {
        // Last lesson: the "next" slot leads back to the course.
        next.textContent = "→ חזרה לקורס";
        next.setAttribute("href", courseUrl);
        next.classList.remove("invisible");
      }
      document.getElementById("nav").classList.remove("hidden");
    })().catch((e) => console.error("lesson nav failed", e));

    // When a video ends, make the next step big and easy to tap.
    const highlightNext = async () => {
      await navReady;
      next.classList.remove("bg-white", "text-[#704229]", "px-4", "py-3");
      next.classList.add("bg-[#704229]", "text-white", "px-6", "py-4", "text-lg");
      next.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    const progSnap = await getDoc(doc(db, "users", user.uid, "progress", lessonId));
    const startAt = progSnap.exists() ? (progSnap.data().lastPositionSec || 0) : 0;

    const save = (extra) => setDoc(
      doc(db, "users", user.uid, "progress", lessonId),
      { updatedAt: new Date().toISOString(), ...extra },
      { merge: true }
    );

    const token = await user.getIdToken();
    const resp = await fetch(`/api/video-url?lessonId=${encodeURIComponent(lessonId)}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (resp.status === 403) { msg.textContent = "אין לך גישה לשיעור הזה"; throw new Error("403"); }
    if (!resp.ok) { msg.textContent = isImage ? "שגיאה בטעינת הטיפ" : "שגיאה בטעינת הסרטון"; throw new Error("video-url failed"); }
    const { url } = await resp.json();

    if (isImage) {
      // Tips are images: show them instead of the player, and count as done once seen.
      video.classList.add("hidden");
      image.classList.remove("hidden");
      image.setAttribute("alt", lesson.title ?? "");
      image.addEventListener("load", () => save({ completed: true }));
      image.setAttribute("src", url);
    } else {
      image.remove();
      video.src = url;
      video.addEventListener("loadedmetadata", () => { if (startAt > 0) video.currentTime = startAt; });

      let lastSaved = 0;
      const savePosition = (extra) => save({ lastPositionSec: Math.floor(video.currentTime), ...extra });
      video.addEventListener("timeupdate", () => {
        if (video.currentTime - lastSaved > 10) { lastSaved = video.currentTime; savePosition({}); }
      });
      video.addEventListener("ended", () => { savePosition({ completed: true }); highlightNext(); });
    }
  </script>
</body>
</html>
