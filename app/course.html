<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>הקורס, מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="stylesheet" href="/app/course.css" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <meta name="theme-color" content="#704229" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="מתחילים בקטן" />
</head>
<body class="app-page course-page">
  <div class="cp-wrap">
    <!-- ?all=1 shows the list even with one course. -->
    <a href="/app/my-courses?all=1" class="cp-back">
      <svg class="app-icon icon--dir" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chevron-back"/></svg>
      הקורסים שלי
    </a>

    <div id="course" class="cp-layout">
      <aside class="cp-aside">
        <header class="cp-head">
          <div class="cp-cover">
            <img id="cover" alt="" width="360" height="450" decoding="async" hidden />
          </div>
          <div class="cp-head-text">
            <h1 id="title" class="cp-title"><span class="app-skeleton cp-sk-title"></span></h1>
            <p id="desc" class="cp-desc">
              <span class="app-skeleton cp-sk-line"></span>
              <span class="app-skeleton cp-sk-line"></span>
              <span class="app-skeleton cp-sk-line cp-sk-line--short"></span>
            </p>
          </div>
        </header>

        <section id="progress-box" class="cp-progress" aria-label="ההתקדמות שלך">
          <p id="progress-text" class="cp-progress-text"><span class="app-skeleton cp-sk-count"></span></p>
          <div id="progress-bar" class="cp-steps" role="progressbar" aria-valuemin="0"
               aria-label="התקדמות בקורס"></div>
          <a id="continue" href="#" class="app-btn cp-continue" aria-disabled="true" tabindex="-1">
            <span id="continue-label"></span>
            <svg class="app-icon icon--dir" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-chevron-forward"/></svg>
          </a>
        </section>
      </aside>

      <div class="cp-main">
        <div id="loading" role="status" aria-live="polite" class="cp-loading">
          <span class="app-sr-only">טוען את השיעורים...</span>
          <div class="cp-group" aria-hidden="true">
            <span class="app-skeleton cp-sk-heading"></span>
            <div class="cp-list">
              <span class="cp-sk-row"><span class="app-skeleton cp-sk-dot"></span><span class="app-skeleton cp-sk-text"></span></span>
              <span class="cp-sk-row"><span class="app-skeleton cp-sk-dot"></span><span class="app-skeleton cp-sk-text"></span></span>
              <span class="cp-sk-row"><span class="app-skeleton cp-sk-dot"></span><span class="app-skeleton cp-sk-text"></span></span>
              <span class="cp-sk-row"><span class="app-skeleton cp-sk-dot"></span><span class="app-skeleton cp-sk-text"></span></span>
              <span class="cp-sk-row"><span class="app-skeleton cp-sk-dot"></span><span class="app-skeleton cp-sk-text"></span></span>
              <span class="cp-sk-row"><span class="app-skeleton cp-sk-dot"></span><span class="app-skeleton cp-sk-text"></span></span>
            </div>
          </div>
        </div>

        <main id="lessons" class="cp-groups" hidden></main>

        <section id="feedback" class="app-card cp-feedback" hidden>
          <div class="cp-feedback-text">
            <p class="cp-feedback-title">צלמי את התרגול ושלחי לי לפידבק אישי</p>
            <p class="cp-feedback-sub">סרטון קצר מהבית מספיק. אני אחזור אלייך עם טיפים שמתאימים לתינוק שלך.</p>
          </div>
          <a id="feedback-link" href="#" target="_blank" rel="noopener" class="app-btn-outline cp-feedback-btn">
            <svg class="app-icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-brand-whatsapp"/></svg>
            שלחי לי בוואטסאפ
          </a>
        </section>
      </div>
    </div>

    <div id="problem" class="app-card cp-problem" hidden>
      <p id="problem-title" class="cp-problem-title"></p>
      <p id="problem-text" class="cp-problem-text"></p>
      <div class="cp-problem-actions">
        <a href="/app/my-courses" class="app-btn cp-btn">לקורסים שלי</a>
        <a href="https://wa.me/972542366243" target="_blank" rel="noopener" class="app-btn-outline cp-btn">
          <svg class="app-icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-brand-whatsapp"/></svg>
          כתבי לנו בוואטסאפ
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import {
      requireAuth, db, signOut, collection, query, where, orderBy, getDocs, doc, getDoc,
    } from "/app/firebase-client.js";
    import {
      courseProgress, continueLabel, whatsAppCourseFeedbackUrl, stepStates, progressText,
    } from "/app/course-progress.js";
    import { groupLessons, lessonIcon } from "/app/course-sections.js";
    import { mountAppHeader } from "/app/app-shell.js";

    const SPRITE = "/assets/icons/sprite.svg";
    const DEFAULT_COVER = "/assets/photos/yarden-course-cover.jpg";
    const $ = (id) => document.getElementById(id);

    const slug = decodeURIComponent(location.pathname.split("/").pop());
    const shell = mountAppHeader();
    const user = await requireAuth();
    shell.showUser(user.email, async () => {
      await signOut(); location.replace("/app/login");
    });

    const PROBLEMS = {
      notFound: ["הקורס לא נמצא", "אולי הקישור לא מדויק. חזרי לרשימת הקורסים שלך ובחרי משם."],
      noAccess: ["אין לך גישה לקורס הזה", "רכשת את הקורס והוא לא נפתח? כתבי לנו ונסדר את זה."],
      error: ["לא הצלחנו לטעון את הקורס", "נסי לרענן את הדף. אם זה חוזר, כתבי לנו."],
    };
    function showProblem(kind) {
      const [title, text] = PROBLEMS[kind];
      $("problem-title").textContent = title;
      $("problem-text").textContent = text;
      $("course").hidden = true;
      $("problem").hidden = false;
    }

    try {
      const problem = await render();
      if (problem) showProblem(problem);
    } catch (err) {
      console.error(err);
      showProblem("error");
    } finally {
      $("loading").hidden = true;
    }

    // A sprite icon: <svg class="app-icon"><use href="...#id"/></svg>.
    function icon(id, extra = "") {
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", `app-icon ${extra}`.trim());
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS(NS, "use");
      use.setAttribute("href", `${SPRITE}#${id}`);
      svg.appendChild(use);
      return svg;
    }

    // Only our own images: a site path like /assets/... (never a remote URL).
    function coverSrc(value) {
      const v = String(value ?? "");
      return /^\/[A-Za-z0-9/_.-]+$/.test(v) && !v.startsWith("//") ? v : DEFAULT_COVER;
    }

    // Renders the course. Returns "notFound" or "noAccess" when it cannot.
    async function render() {
      const courseQ = query(collection(db, "courses"), where("slug", "==", slug));
      const courseDocs = await getDocs(courseQ);
      // An unpublished course (published === false) is treated as not found.
      const courseDoc = courseDocs.docs.find((d) => d.data().published !== false);
      if (!courseDoc) return "notFound";
      const courseId = courseDoc.id;
      const c = courseDoc.data();

      const enr = await getDoc(doc(db, "users", user.uid, "enrollments", courseId));
      if (!enr.exists()) return "noAccess";

      const lessonsSnap = await getDocs(
        query(collection(db, "lessons"), where("courseId", "==", courseId), orderBy("order"))
      );
      const progressSnap = await getDocs(collection(db, "users", user.uid, "progress"));
      const completed = new Set(progressSnap.docs.filter(d => d.data().completed).map(d => d.id));

      // Build with DOM APIs only (textContent / setAttribute), never innerHTML.
      $("title").textContent = c.title ?? "";
      $("desc").textContent = c.description ?? "";
      if (c.title) document.title = `${c.title}, מתחילים בקטן`;
      const cover = $("cover");
      cover.setAttribute("src", coverSrc(c.coverImage));
      cover.hidden = false;

      const lessonHref = (id) => `/app/lesson/${encodeURIComponent(id)}`;
      const lessons = lessonsSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
      const lessonIds = lessons.map((l) => l.id);
      const prog = courseProgress(lessonIds, completed);
      // The current lesson is the next one to watch; none when the course is finished.
      const currentId = prog.done < prog.total ? prog.nextId : null;

      const box = $("progress-box");
      if (prog.total > 0) {
        $("progress-text").textContent = progressText(prog);
        const bar = $("progress-bar");
        bar.setAttribute("aria-valuemax", String(prog.total));
        bar.setAttribute("aria-valuenow", String(prog.done));
        bar.setAttribute("aria-valuetext", progressText(prog));
        let filled = 0;
        stepStates(lessonIds, completed).forEach((done) => {
          const seg = document.createElement("span");
          seg.className = "cp-step";
          if (done) {
            const fill = document.createElement("span");
            fill.className = "cp-step-fill";
            // Fill one after the other from the start side, once, on load.
            fill.style.setProperty("--i", String(filled++));
            seg.appendChild(fill);
          }
          bar.appendChild(seg);
        });
        const cont = $("continue");
        cont.href = lessonHref(prog.nextId);
        cont.removeAttribute("aria-disabled");
        cont.removeAttribute("tabindex");
        $("continue-label").textContent = continueLabel(prog);
      } else {
        box.hidden = true;
      }

      $("feedback-link").href = whatsAppCourseFeedbackUrl(c.title);
      $("feedback").hidden = false;

      const wrap = $("lessons");
      for (const group of groupLessons(lessons)) {
        const section = document.createElement("section");
        section.className = `cp-group cp-group--${group.key}`;
        const headId = `group-${group.key}`;
        section.setAttribute("aria-labelledby", headId);

        const head = document.createElement("div");
        head.className = "cp-group-head";
        const h2 = document.createElement("h2");
        h2.id = headId;
        h2.className = "cp-group-title";
        h2.textContent = group.label;
        const groupDone = group.lessons.filter((l) => completed.has(l.id)).length;
        const meta = document.createElement("span");
        meta.className = "cp-group-meta";
        meta.textContent = `${groupDone} מתוך ${group.lessons.length}`;
        head.append(h2, meta);

        const list = document.createElement("ol");
        list.className = "cp-list";
        for (const l of group.lessons) {
          const done = completed.has(l.id);
          const current = l.id === currentId;
          const a = document.createElement("a");
          a.href = lessonHref(l.id);
          a.className = "cp-row" + (done ? " is-done" : "") + (current ? " is-current" : "");
          if (current) a.setAttribute("aria-current", "step");

          const title = document.createElement("span");
          title.className = "cp-row-title";
          title.textContent = l.title ?? "";
          // Tip tiles are narrow: a done tip shows the check in place of its type icon.
          const tile = group.key === "tips";
          a.append(tile && done && !current
            ? icon("i-check", "cp-row-done")
            : icon(lessonIcon(l, group.key), "cp-row-icon"), title);

          if (current) {
            const here = document.createElement("span");
            here.className = "cp-here";
            here.textContent = "כאן עצרת";
            a.appendChild(here);
          } else if (done) {
            if (!tile) a.appendChild(icon("i-check", "cp-row-done"));
            const sr = document.createElement("span");
            sr.className = "app-sr-only";
            sr.textContent = "בוצע";
            a.appendChild(sr);
          }
          const li = document.createElement("li");
          li.appendChild(a);
          list.appendChild(li);
        }
        section.append(head, list);
        wrap.appendChild(section);
      }
      wrap.hidden = false;
      return null;
    }
  </script>
</body>
</html>
