<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קורס — מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <meta name="theme-color" content="#704229" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="מתחילים בקטן" />
</head>
<body class="min-h-screen p-4">
  <div class="max-w-2xl mx-auto py-4">
    <!-- ?all=1 shows the list even with one course. -->
    <a href="/app/my-courses?all=1" class="text-sm app-link">→ הקורסים שלי</a>
    <h1 id="title" class="text-2xl font-bold mt-2"></h1>
    <p id="desc" class="app-mid mt-1"></p>
  </div>
  <div id="loading" role="status" aria-live="polite"
       class="max-w-2xl mx-auto flex items-center justify-center gap-3 py-12 text-[#704229]">
    <span class="w-6 h-6 border-4 border-[#704229]/20 border-t-[#704229] rounded-full animate-spin" aria-hidden="true"></span>
    <span>טוען...</span>
  </div>
  <section id="progress-box" class="max-w-2xl mx-auto app-card p-5 mb-4 hidden">
    <p id="progress-text" class="font-medium text-[#704229]"></p>
    <div id="progress-bar" role="progressbar" aria-valuemin="0" aria-label="התקדמות בקורס"
         class="mt-2 h-2 w-full bg-[#704229]/15 rounded-full overflow-hidden">
      <div id="progress-fill" class="h-full bg-[#704229] rounded-full" style="width:0%"></div>
    </div>
    <a id="continue" href="#"
       class="mt-4 block app-btn px-4 py-3"></a>
  </section>
  <main id="lessons" class="max-w-2xl mx-auto space-y-2"></main>
  <section id="feedback" class="max-w-2xl mx-auto app-card p-5 mt-6 text-center hidden">
    <p class="font-bold text-[#704229]">צלמי את התרגול ושלחי לי לפידבק אישי</p>
    <p class="text-sm app-muted mt-1">סרטון קצר מהבית מספיק. אני אחזור אלייך עם טיפים שמתאימים לתינוק שלך.</p>
    <a id="feedback-link" href="#" target="_blank" rel="noopener"
       class="mt-3 app-btn-outline px-5 py-2">שלחי לי בוואטסאפ</a>
  </section>
  <div id="problem" class="max-w-2xl mx-auto text-center app-card p-6 hidden">
    <p id="problem-title" class="font-bold text-lg text-[#704229]"></p>
    <p id="problem-text" class="text-sm app-mid mt-2"></p>
    <div class="mt-4 flex flex-wrap justify-center gap-3">
      <a href="/app/my-courses" class="app-btn px-4 py-2">לקורסים שלי</a>
      <a href="https://wa.me/972542366243" target="_blank" rel="noopener"
         class="app-btn-outline px-4 py-2">כתבי לנו בוואטסאפ</a>
    </div>
  </div>

  <script type="module">
    import {
      requireAuth, db, signOut, collection, query, where, orderBy, getDocs, doc, getDoc,
    } from "/app/firebase-client.js";
    import { courseProgress, continueLabel, whatsAppCourseFeedbackUrl } from "/app/course-progress.js";
    import { mountAppHeader } from "/app/app-shell.js";

    const slug = decodeURIComponent(location.pathname.split("/").pop());
    const shell = mountAppHeader();
    const user = await requireAuth();
    shell.showUser(user.email, async () => {
      await signOut(); location.replace("/app/login");
    });

    const PROBLEMS = {
      notFound: ["הקורס לא נמצא", "אולי הקישור לא מדויק. חזרי לרשימת הקורסים שלך ובחרי משם."],
      noAccess: ["אין לך גישה לקורס הזה", "רכשת את הקורס והוא לא נפתח? כתבי לנו ונסדר את זה."],
      error: ["לא הצלחנו לטעון את הקורס", "נסי לרענן את הדף. אם זה חוזר, כתבי לנו."],
    };
    function showProblem(kind) {
      const [title, text] = PROBLEMS[kind];
      document.getElementById("problem-title").textContent = title;
      document.getElementById("problem-text").textContent = text;
      document.getElementById("problem").classList.remove("hidden");
    }

    const loading = document.getElementById("loading");
    try {
      const problem = await render();
      if (problem) showProblem(problem);
    } catch (err) {
      console.error(err);
      showProblem("error");
    } finally {
      loading.classList.add("hidden");
    }

    // Renders the course. Returns "notFound" or "noAccess" when it cannot.
    async function render() {
      const courseQ = query(collection(db, "courses"), where("slug", "==", slug));
      const courseDocs = await getDocs(courseQ);
      // An unpublished course (published === false) is treated as not found.
      const courseDoc = courseDocs.docs.find((d) => d.data().published !== false);
      if (!courseDoc) return "notFound";
      const courseId = courseDoc.id;
      const c = courseDoc.data();

      const enr = await getDoc(doc(db, "users", user.uid, "enrollments", courseId));
      if (!enr.exists()) return "noAccess";

      const lessonsSnap = await getDocs(
        query(collection(db, "lessons"), where("courseId", "==", courseId), orderBy("order"))
      );
      const progressSnap = await getDocs(collection(db, "users", user.uid, "progress"));
      const completed = new Set(progressSnap.docs.filter(d => d.data().completed).map(d => d.id));

      document.getElementById("title").textContent = c.title ?? "";
      document.getElementById("desc").textContent = c.description ?? "";

      const lessonHref = (id) => `/app/lesson/${encodeURIComponent(id)}`;
      const lessonIds = lessonsSnap.docs.map((d) => d.id);
      const prog = courseProgress(lessonIds, completed);
      // The current lesson is the next one to watch; none when the course is finished.
      const currentId = prog.done < prog.total ? prog.nextId : null;

      if (prog.total > 0) {
        document.getElementById("progress-text").textContent =
          `${prog.done} מתוך ${prog.total} שיעורים`;
        const bar = document.getElementById("progress-bar");
        bar.setAttribute("aria-valuemax", String(prog.total));
        bar.setAttribute("aria-valuenow", String(prog.done));
        bar.setAttribute("aria-valuetext", `${prog.done} מתוך ${prog.total} שיעורים`);
        document.getElementById("progress-fill").style.width =
          `${Math.round((prog.done / prog.total) * 100)}%`;
        const cont = document.getElementById("continue");
        cont.href = lessonHref(prog.nextId);
        cont.textContent = continueLabel(prog);
        document.getElementById("progress-box").classList.remove("hidden");
      }

      const feedback = document.getElementById("feedback-link");
      feedback.href = whatsAppCourseFeedbackUrl(c.title);
      document.getElementById("feedback").classList.remove("hidden");

      const wrap = document.getElementById("lessons");
      lessonsSnap.docs.forEach((d, i) => {
        const l = d.data();
        const done = completed.has(d.id);
        const current = d.id === currentId;
        const a = document.createElement("a");
        a.href = lessonHref(d.id);
        a.className = `flex items-center gap-3 bg-white app-row px-4 py-3 border-2 ${current ? "border-[#704229]" : "border-transparent"}`;
        if (current) a.setAttribute("aria-current", "step");
        // Build with DOM APIs — never innerHTML with Firestore data.
        const badge = document.createElement("span");
        badge.className = `w-6 h-6 flex items-center justify-center rounded-full ${done ? "bg-[#2f9e6b] text-white" : "app-badge"} text-sm font-medium`;
        badge.textContent = done ? "✓" : String(i + 1);
        const label = document.createElement("span");
        label.className = "font-medium";
        label.textContent = l.title ?? "";
        a.append(badge, label);
        wrap.appendChild(a);
      });
      return null;
    }
  </script>
</body>
</html>
