<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>כניסה לקורסים | מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app/app.css" />
  <link rel="manifest" href="/app/manifest.webmanifest" />
  <meta name="theme-color" content="#704229" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="מתחילים בקטן" />
</head>
<body class="app-page">
  <a class="app-skip-link" href="#main">דלגי לתוכן</a>
  <main id="main" tabindex="-1" class="app-card app-auth">
    <div class="app-auth-head">
      <img class="app-auth-portrait" src="/assets/yarden-portrait.jpg" alt="ירדן שוהם"
           width="64" height="64" decoding="async" />
      <h1 class="app-h1">כניסה לקורסים</h1>
      <p class="app-lead">שמחה שאת כאן. הזיני את האימייל והסיסמה שלך.</p>
    </div>

    <form id="login-form" class="app-form" aria-describedby="msg">
      <div class="app-field">
        <label for="email" class="app-label">אימייל</label>
        <input id="email" type="email" required dir="ltr" placeholder="name@example.com"
               class="app-input" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" />
      </div>
      <div class="app-field">
        <label for="password" class="app-label">סיסמה</label>
        <div class="app-password">
          <input id="password" type="password" required dir="ltr"
                 class="app-input" autocomplete="current-password" />
          <button type="button" id="toggle" class="app-password-toggle" aria-pressed="false">הצגה</button>
        </div>
      </div>
      <p id="msg" role="status" aria-live="polite" class="app-msg app-msg--error"></p>
      <button type="submit" id="submit" class="app-btn">כניסה</button>
    </form>

    <button type="button" id="reset" class="app-link app-auth-alt">שכחתי סיסמה</button>

    <div class="app-note">
      <p><strong>פעם ראשונה?</strong> בחרי סיסמה דרך הקישור שקיבלת במייל. הקישור בתוקף לשעה. אם עבר יותר זמן, לחצי "שכחתי סיסמה" ותקבלי קישור חדש.</p>
      <p>צריכה עזרה?
        <a href="https://wa.me/972542366243" target="_blank" rel="noopener"
           class="app-link">כתבי לנו בוואטסאפ</a>
      </p>
    </div>
  </main>

  <!-- Legal links (U20). The app pages have no footer, so a small row here. -->
  <nav aria-label="מידע משפטי" style="display:flex; flex-wrap:wrap; justify-content:center; gap:0 var(--s-5); margin-block-start:var(--s-5); font-size:var(--fs-small);">
    <a class="app-link" href="/terms" style="display:inline-flex; align-items:center; min-block-size:44px;">תנאי שימוש</a>
    <a class="app-link" href="/privacy" style="display:inline-flex; align-items:center; min-block-size:44px;">מדיניות פרטיות</a>
    <a class="app-link" href="/accessibility" style="display:inline-flex; align-items:center; min-block-size:44px;">הצהרת נגישות</a>
  </nav>

  <script type="module">
    import { signIn, resetPassword, auth, onAuthStateChanged } from "/app/firebase-client.js";
    import { safeNext } from "/app/safe-next.js";
    import { messageFor } from "/app/auth-errors.js";
    import { mountAppHeader, wirePasswordToggle, setBusy } from "/app/app-shell.js";

    mountAppHeader();

    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const next = safeNext(params.get("next"));
    const msg = $("msg");
    const submit = $("submit");
    const resetBtn = $("reset");

    wirePasswordToggle($("password"), $("toggle"));

    function say(text, kind = "error") {
      msg.className = `app-msg app-msg--${kind}`;
      msg.textContent = text;
    }

    onAuthStateChanged(auth, (user) => { if (user) location.replace(next); });

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submit.disabled) return;
      say("");
      const done = setBusy(submit, "מתחברת...");
      try {
        await signIn($("email").value.trim(), $("password").value);
        location.replace(next); // keep the busy state while the next page loads
      } catch (err) {
        done();
        say(messageFor(err?.code));
      }
    });

    resetBtn.addEventListener("click", async () => {
      const email = $("email").value.trim();
      if (!email) { say(messageFor("auth/missing-email", "reset")); $("email").focus(); return; }
      say("");
      resetBtn.disabled = true;
      try {
        await resetPassword(email);
        say("שלחנו לך מייל לבחירת סיסמה. הקישור בתוקף לשעה. בדקי גם בספאם.", "ok");
      } catch (err) {
        say(messageFor(err?.code, "reset"));
      } finally {
        resetBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
