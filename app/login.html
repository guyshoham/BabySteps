<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כניסה — מתחילים בקטן</title>
  <link rel="icon" type="image/png" href="/assets/logos/logo-peach.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body{font-family:'Rubik',sans-serif}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#fdf6f0] p-4">
  <main class="w-full max-w-sm bg-white rounded-2xl shadow p-6">
    <h1 class="text-xl font-bold text-center mb-4">כניסה לקורסים</h1>
    <form id="login-form" class="space-y-3">
      <div>
        <label for="email" class="block text-sm font-bold text-[#704229] mb-1">אימייל</label>
        <input id="email" type="email" required dir="ltr" placeholder="name@example.com"
               class="w-full border rounded-lg px-3 py-2" autocomplete="email" />
      </div>
      <div>
        <label for="password" class="block text-sm font-bold text-[#704229] mb-1">סיסמה</label>
        <input id="password" type="password" required dir="ltr"
               class="w-full border rounded-lg px-3 py-2" autocomplete="current-password" />
      </div>
      <button type="submit" class="w-full bg-[#704229] text-white rounded-lg py-2 font-semibold">
        כניסה
      </button>
    </form>
    <button id="reset" class="w-full text-sm text-[#704229] mt-3 underline">שכחתי סיסמה</button>
    <p id="msg" role="status" aria-live="polite" class="text-sm text-red-600 mt-3 text-center"></p>
    <div class="mt-5 pt-4 border-t text-sm text-gray-600 text-center space-y-2">
      <p>פעם ראשונה? בחרי סיסמה דרך הקישור שקיבלת במייל, או לחצי על "שכחתי סיסמה".</p>
      <p>צריכה עזרה?
        <a href="https://wa.me/972542366243" target="_blank" rel="noopener"
           class="text-[#704229] underline font-medium">כתבי לנו בוואטסאפ</a>
      </p>
    </div>
  </main>

  <script type="module">
    import { signIn, resetPassword, auth, onAuthStateChanged } from "/app/firebase-client.js";
    import { safeNext } from "/app/safe-next.js";
    import { messageFor } from "/app/auth-errors.js";

    const params = new URLSearchParams(location.search);
    const next = safeNext(params.get("next"));
    const msg = document.getElementById("msg");

    onAuthStateChanged(auth, (user) => { if (user) location.replace(next); });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "text-sm text-red-600 mt-3 text-center";
      msg.textContent = "";
      try {
        await signIn(document.getElementById("email").value.trim(),
                     document.getElementById("password").value);
        location.replace(next);
      } catch (e) {
        msg.textContent = messageFor(e?.code);
      }
    });

    document.getElementById("reset").addEventListener("click", async () => {
      msg.className = "text-sm text-red-600 mt-3 text-center";
      const email = document.getElementById("email").value.trim();
      if (!email) { msg.textContent = messageFor("auth/missing-email", "reset"); return; }
      try {
        await resetPassword(email);
        msg.className = "text-sm text-green-700 mt-3 text-center";
        msg.textContent = "שלחנו לך מייל לבחירת סיסמה. בדקי גם בספאם.";
      } catch (e) {
        msg.textContent = messageFor(e?.code, "reset");
      }
    });
  </script>
</body>
</html>
